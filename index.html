<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dice Roguelike - 模組化版本</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
    html, body { margin: 0; height: 100%; background: #111118; overflow: hidden; color: #fff; font-family: monospace; }
    #game-container { width: 100vw; height: 100vh; }

    /* 暫時允許小螢幕頁面捲動；桌面端維持原本的固定視窗行為。 */
    @media (max-width: 900px), (max-height: 600px) {
        html, body {
            overflow: auto;
            min-height: 100%;
        }

        #game-container {
            overflow: visible;
        }
    }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module" src="./js/main.js"></script>
</body>
